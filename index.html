<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Колесо Фортуны</title>
    <!-- Подключаем Telegram -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden; /* Запрещаем прокрутку экрана */
        }

        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 30px;
        }

        /* Само колесо */
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            /* Плавная остановка (замедление) */
            transition: transform 5s cubic-bezier(0.25, 0.1, 0.1, 1);
            transform: rotate(0deg);
        }

        /* Стрелочка сверху */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            color: #ffd700;
            z-index: 10;
            text-shadow: 0 0 10px black;
        }

        /* Кнопка */
        button {
            background-color: #ffd700;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background-color: #555;
            color: #999;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Текст результата */
        #result {
            margin-top: 20px;
            font-size: 24px;
            height: 30px;
            font-weight: bold;
            color: #ffd700;
        }
    </style>
</head>
<body>

    <div class="wheel-container">
        <div class="pointer">▼</div>
        <!-- Рисуем колесо через SVG -->
        <svg id="wheel" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- Сектора (цвета: красный, черный, красный, черный и т.д.) -->
            <path d="M50 50 L50 0 A50 50 0 0 1 85.35 14.65 Z" fill="#e63946" />
            <path d="M50 50 L85.35 14.65 A50 50 0 0 1 100 50 Z" fill="#1d1d1d" />
            <path d="M50 50 L100 50 A50 50 0 0 1 85.35 85.35 Z" fill="#e63946" />
            <path d="M50 50 L85.35 85.35 A50 50 0 0 1 50 100 Z" fill="#1d1d1d" />
            <path d="M50 50 L50 100 A50 50 0 0 1 14.65 85.35 Z" fill="#e63946" />
            <path d="M50 50 L14.65 85.35 A50 50 0 0 1 0 50 Z" fill="#1d1d1d" />
            <path d="M50 50 L0 50 A50 50 0 0 1 14.65 14.65 Z" fill="#e63946" />
            <path d="M50 50 L14.65 14.65 A50 50 0 0 1 50 0 Z" fill="#1d1d1d" />
            
            <!-- Тексты на секторах -->
            <text x="70" y="30" fill="white" font-size="6" font-weight="bold">10</text>
            <text x="70" y="75" fill="white" font-size="6" font-weight="bold">0</text>
            <text x="25" y="75" fill="white" font-size="6" font-weight="bold">5</text>
            <text x="25" y="30" fill="white" font-size="6" font-weight="bold">0</text>
            <text x="80" y="52" fill="white" font-size="6" font-weight="bold">2</text>
            <text x="15" y="52" fill="white" font-size="6" font-weight="bold">0</text>
            <text x="50" y="15" fill="white" font-size="6" font-weight="bold">0</text>
            <text x="50" y="90" fill="white" font-size="6" font-weight="bold">5</text>

            <!-- Центральный круг -->
            <circle cx="50" cy="50" r="10" fill="#333" stroke="#ffd700" stroke-width="1"/>
        </svg>
    </div>

    <button id="spinBtn">Крутить</button>
    <div id="result"></div>

    <script>
        // 1. Подключаем Telegram
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 2. Элементы страницы
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const resultDiv = document.getElementById('result');

        // 3. Переменные для углов
        let currentRotation = 0; // Текущий угол поворота
        const sectors = [0, 10, 0, 2, 5, 0, 10, 5]; // Выигрыши на секторах (по кругу)
        const sectorAngle = 360 / sectors.length; // Угол одного сектора (45 градусов)

        // 4. Функция вращения
        spinBtn.addEventListener('click', () => {
            // Блокируем кнопку, чтобы не нажали дважды
            spinBtn.disabled = true;
            resultDiv.innerText = "";

            // Выбираем случайный сектор (от 0 до 7)
            const winningSectorIndex = Math.floor(Math.random() * sectors.length);
            
            // Считаем, на сколько градусов нужно повернуть колесо
            // Добавляем 360 * 5 (5 полных оборотов) для красоты
            const spins = 5; 
            
            // Угол, на который нужно повернуть (с учётом текущего положения)
            // Мы крутим по часовой стрелке, поэтому вычитаем угол сектора
            const targetAngle = (spins * 360) + (360 - (winningSectorIndex * sectorAngle));
            
            // Применяем вращение
            currentRotation += targetAngle;
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            // Ждем 5 секунд (столько длится анимация), затем показываем результат
            setTimeout(() => {
                const winAmount = sectors[winningSectorIndex];
                resultDiv.innerText = `Вы выиграли: ${winAmount} ⭐`;
                
                // Включаем кнопку обратно
                spinBtn.disabled = false;
                
                // Если открыто в Telegram, вибрируем телефон (от 0 до 1 секунды)
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }, 5000); // 5000 миллисекунд = 5 секунд
        });
    </script>
</body>
</html>

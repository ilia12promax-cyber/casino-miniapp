<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Колесо Фортуны</title>
    
    <!-- 1. Подключаем Telegram (обязательно!) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- 2. Подключаем базу данных Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Верхняя панель с балансом */
        .top-bar {
            position: absolute;
            top: 20px;
            width: 90%;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            background: #333;
            padding: 15px;
            border-radius: 15px;
            box-sizing: border-box;
            border: 1px solid #444;
            z-index: 100;
        }

        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 30px;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            transition: transform 5s cubic-bezier(0.25, 0.1, 0.1, 1);
            transform: rotate(0deg);
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            color: #ffd700;
            z-index: 10;
            text-shadow: 0 0 10px black;
        }

        button {
            background-color: #ffd700;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            transition: transform 0.1s;
            margin-top: 10px;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background-color: #555;
            color: #999;
            cursor: not-allowed;
            box-shadow: none;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            height: 30px;
            font-weight: bold;
            color: #ffd700;
            text-align: center;
            z-index: 100;
        }

        /* Блок для вывода ошибок */
        #errorText {
            position: absolute;
            top: 80px;
            width: 90%;
            color: #ff4444;
            font-size: 12px;
            word-break: break-all;
            text-align: center;
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- Плашка с балансом -->
    <div class="top-bar">
        <span>Баланс:</span>
        <span id="balanceDisplay">...</span> ⭐
    </div>
    
    <!-- Сюда будут выводиться ошибки -->
    <div id="errorText"></div>

    <div class="wheel-container">
        <div class="pointer">▼</div>
        <svg id="wheel" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- Сектора -->
            <path d="M50 50 L50 0 A50 50 0 0 1 85.35 14.65 Z" fill="#e63946" />
            <path d="M50 50 L85.35 14.65 A50 50 0 0 1 100 50 Z" fill="#1d1d1d" />
            <path d="M50 50 L100 50 A50 50 0 0 1 85.35 85.35 Z" fill="#e63946" />
            <path d="M50 50 L85.35 85.35 A50 50 0 0 1 50 100 Z" fill="#1d1d1d" />
            <path d="M50 50 L50 100 A50 50 0 0 1 14.65 85.35 Z" fill="#e63946" />
            <path d="M50 50 L14.65 85.35 A50 50 0 0 1 0 50 Z" fill="#1d1d1d" />
            <path d="M50 50 L0 50 A50 50 0 0 1 14.65 14.65 Z" fill="#e63946" />
            <path d="M50 50 L14.65 14.65 A50 50 0 0 1 50 0 Z" fill="#1d1d1d" />
            
            <!-- Тексты -->
            <text x="70" y="30" fill="white" font-size="6" font-weight="bold">10</text>
            <text x="70" y="75" fill="white" font-size="6" font-weight="bold">0</text>
            <text x="25" y="75" fill="white" font-size="6" font-weight="bold">5</text>
            <text x="25" y="30" fill="white" font-size="6" font-weight="bold">0</text>
            <text x="80" y="52" fill="white" font-size="6" font-weight="bold">2</text>
            <text x="15" y="52" fill="white" font-size="6" font-weight="bold">0</text>
            <text x="50" y="15" fill="white" font-size="6" font-weight="bold">0</text>
            <text x="50" y="90" fill="white" font-size="6" font-weight="bold">5</text>

            <circle cx="50" cy="50" r="10" fill="#333" stroke="#ffd700" stroke-width="1"/>
        </svg>
    </div>

    <button id="spinBtn" disabled>Загрузка...</button>
    <div id="result"></div>

    <script>
        // ==========================================
        // ⚠️ ТВОИ ДАННЫЕ SUPABASE
        // ==========================================
        const SUPABASE_URL = 'https://hhlhxmwlwegvarfoheep.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ZvsBouWIg6tZQrocsDD-rA__iKXHxqe';
        // ==========================================
        
        // 1. Подключение
        const tg = window.Telegram.WebApp;
        tg.expand();
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. Элементы
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const resultDiv = document.getElementById('result');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const errorText = document.getElementById('errorText');

        // 3. Переменные
        let currentRotation = 0;
        let userId = null;
        let userBalance = 0;
        const cost = 10;
        
        const sectors = [0, 10, 0, 2, 5, 0, 10, 5];
        const sectorAngle = 360 / sectors.length;

        // 4. Функция запуска игры
        async function initGame() {
            userId = tg.initDataUnsafe?.user?.id;
            
            if (!userId) {
                errorText.innerText = "Ошибка: Играйте только внутри Telegram! (Нет ID)";
                spinBtn.innerText = "Ошибка";
                return;
            }

            // Ищем игрока в базе
            let { data, error } = await supabase
                .from('users')
                .select('*')
                .eq('telegram_id', userId)
                .single();

            // Если произошла ошибка (кроме "не найдено")
            if (error && error.code !== 'PGRST116') {
                errorText.innerText = "Ошибка Supabase: " + error.message;
                spinBtn.innerText = "Ошибка БД";
                return;
            }

            // Если игрока нет — создаем
            if (!data) {
                let { data: newUser, error: insertError } = await supabase
                    .from('users')
                    .insert([{ telegram_id: userId, balance: 30, bonus_claimed: true }])
                    .select()
                    .single();
                
                if (insertError) {
                    errorText.innerText = "Ошибка создания: " + insertError.message;
                    spinBtn.innerText = "Ошибка записи";
                    return;
                }
                data = newUser;
                tg.showAlert("Добро пожаловать! Тебе начислено 30 бонусных ⭐");
            }

            // Обновляем экран
            userBalance = data.balance;
            updateBalanceUI();
            
            spinBtn.disabled = false;
            spinBtn.innerText = "Крутить (10 ⭐)";
        }

        function updateBalanceUI() {
            balanceDisplay.innerText = userBalance;
        }

        // 5. Логика вращения
        spinBtn.addEventListener('click', async () => {
            if (userBalance < cost) {
                tg.showAlert("Недостаточно звёзд! Напиши мне в ЛС, чтобы пополнить баланс.");
                return;
            }

            spinBtn.disabled = true;
            spinBtn.innerText = "Крутится...";
            resultDiv.innerText = "";

            userBalance -= cost;
            updateBalanceUI();

            await supabase
                .from('users')
                .update({ balance: userBalance })
                .eq('telegram_id', userId);

            const winningSectorIndex = Math.floor(Math.random() * sectors.length);
            const spins = 5; 
            const targetAngle = (spins * 360) + (360 - (winningSectorIndex * sectorAngle));
            
            currentRotation += targetAngle;
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(async () => {
                const winAmount = sectors[winningSectorIndex];
                
                if (winAmount > 0) {
                    resultDiv.innerText = `Вы выиграли: ${winAmount} ⭐`;
                    userBalance += winAmount;
                    updateBalanceUI();
                    
                    await supabase
                        .from('users')
                        .update({ balance: userBalance })
                        .eq('telegram_id', userId);
                        
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                } else {
                    resultDiv.innerText = `Вы проиграли! (Ставка сгорела)`;
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                }
                
                spinBtn.disabled = false;
                spinBtn.innerText = "Крутить (10 ⭐)";
            }, 5000);
        });

        // Запускаем игру
        initGame();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎰 Казино</title>
    
    <!-- 1. Подключаем официальный скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* 2. Стили: делаем тёмный фон, как в Telegram */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; /* Тёмно-серый фон */
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Добро пожаловать в игру!</h1>
        <p>Здесь скоро появится колесо фортуны.</p>
    </div>

    <script>
        // 3. Инициализируем Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем приложение на весь экран
        
        // Проверяем, работает ли скрипт (показываем всплывашку)
        // Если ты откроешь эту страницу в обычном браузере, всплывашка не появится
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            tg.showAlert("Привет, " + tg.initDataUnsafe.user.first_name + "! Telegram подключен.");
        } else {
            console.log("Мы не в Telegram или скрипт не загрузился");
        }
    </script>
</body>
</html>
